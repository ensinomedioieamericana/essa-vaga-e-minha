name: Importar PDFs ENEM 2025 UNESP UNICAMP 2026

on:
  push:
    paths:
      - '.github/workflows/importar-provas-2025-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-provas-2025-2026
  cancel-in-progress: false

jobs:
  importar:
    name: Conferir PDFs originais e publicar no GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check 'gdown==5.2.0'

      - name: Validar importador
        run: python -m py_compile scripts/importar_provas_2025_2026.py

      - name: Baixar e conferir 19 PDFs por SHA-256
        run: python scripts/importar_provas_2025_2026.py

      - name: Publicar PDFs verificados e atualizar catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A acervo/enem/2025/ acervo/unesp/2026/ acervo/unicamp/2026/ acervo-dados.js
          if git diff --cached --quiet; then
            echo "Sem PDFs novos. Nenhum commit necessário."
            exit 0
          fi
          git commit -m "Banco de Provas: importar PDFs verificados ENEM 2025 UNESP UNICAMP 2026"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main:refs/remotes/origin/main
            git rebase -X ours origin/main
            python scripts/gerar_acervo.py
            if ! git diff --quiet -- acervo-dados.js; then
              git add acervo-dados.js
              git commit -m "Atualizar catálogo com PDFs comprovadamente publicados"
            fi
            if git push origin HEAD:main; then
              echo "Arquivos originais e catálogo publicados em main."
              exit 0
            fi
            echo "Repositório alterado simultaneamente; repetindo ($attempt/5)."
            sleep $((attempt * 3))
          done
          exit 1
