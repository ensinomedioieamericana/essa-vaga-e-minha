name: Gerar logo branco exclusivo do login dos alunos

on:
  push:
    paths:
      - '.github/workflows/gerar-logo-login-branco.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logo-login-branco
  cancel-in-progress: false

jobs:
  gerar:
    name: Trocar azul das palavras Vaga e Minha por branco
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Preparar biblioteca de imagens
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Criar PNG sem alterar o logo original
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source=Path('assets/essa-vaga-logo.png')
          target=Path('assets/essa-vaga-logo-login.png')
          with Image.open(source) as original:
              image=original.convert('RGBA')
          w,h=image.size
          pixels=image.load()
          changed=0
          opaque=0
          red_preserved=0
          for y in range(h):
              for x in range(w):
                  r,g,b,a=pixels[x,y]
                  if a<12:
                      continue
                  # Limitar a troca ao texto VAGA/MINHA; nao atingir o circulo.
                  in_words=(y>=int(h*.24) and x<int(w*.67)) or (
                      y>=int(h*.59) and x<int(w*.94))
                  # Separar tintas azul-violeta das tintas vermelhas e do branco.
                  is_blue=(b>r*1.27 and b>g*1.18 and b>=70 and r<170)
                  if in_words and is_blue:
                      # Preserve cada alfa, contornos e antialiasing do original.
                      pixels[x,y]=(255,255,255,a)
                      changed+=1
                  elif a>160 and r>150 and r>g*1.6 and r>b*1.5:
                      red_preserved+=1
                  if a>200:
                      opaque+=1
          if changed<350 or red_preserved<80:
              raise RuntimeError(
                  f'Conferencia insuficiente: branco alterado={changed}; '
                  f'vermelho preservado={red_preserved}; total={w}x{h}')
          target.parent.mkdir(parents=True,exist_ok=True)
          image.save(target,format='PNG',optimize=True)
          print(f'Criado {target}: {w}x{h}; {changed} pixels azuis convertidos; '
                f'{red_preserved} pixels vermelhos preservados; '
                f'{target.stat().st_size} bytes.')
          PY
      - name: Publicar a nova imagem
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/essa-vaga-logo-login.png
          if git diff --cached --quiet; then
            echo 'Imagem de login ja atualizada.'
          else
            git commit -m 'Criar logo com VAGA e MINHA brancos para login dos alunos'
            git push origin HEAD:main
          fi
