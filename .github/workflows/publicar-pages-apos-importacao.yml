name: Publicar GitHub Pages após importação de provas

# A importação usa GITHUB_TOKEN para gravar os PDFs em main.
# Esses commits não disparam automaticamente o build do GitHub Pages,
# por isso pedimos um novo build ao concluir a importação com sucesso.
on:
  workflow_run:
    workflows:
      - "Importar PDFs das provas anteriores"
      - "Importar PDFs FAMEMA 2021-2024"
      - "Importar PDFs ENEM 2025 UNESP UNICAMP 2026"
      - "Corrigir PDF ENEM 2025 segundo dia"
      - "Importar PDFs UNICAMP 2027 primeira fase"
      - "Importar PDFs FAMERP 2021-2024"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  publicar:
    name: Solicitar atualização do GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar publicação da versão mais recente de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Importação concluída. Solicitando build do GitHub Pages para a versão mais recente de main."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          echo "Build solicitado. Verifique o resultado nas execuções de 'pages build and deployment'."
