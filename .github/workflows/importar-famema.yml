name: Importar PDFs FAMEMA 2021-2024

on:
  push:
    paths:
      - '.github/workflows/importar-famema.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: importar-famema-pdfs
  cancel-in-progress: false

jobs:
  importar:
    name: Conferir originais FAMEMA e publicar no GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Instalar dependências do importador
        run: python -m pip install --disable-pip-version-check 'gdown==5.2.0'

      - name: Conferir script antes da importação
        run: python -m py_compile scripts/importar_famema_drive.py

      - name: Baixar e validar os PDFs originais FAMEMA
        run: python scripts/importar_famema_drive.py

      - name: Publicar os PDFs e catálogo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A acervo/famema/ acervo-dados.js
          if git diff --cached --quiet; then
            echo "Nenhum PDF FAMEMA novo para publicar."
            exit 0
          fi
          git commit -m "FAMEMA: publicar PDFs originais das provas 2021-2024"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main:refs/remotes/origin/main
            git rebase -X ours origin/main
            python scripts/gerar_acervo.py
            if ! git diff --quiet -- acervo-dados.js; then
              git add acervo-dados.js
              git commit -m "FAMEMA: sincronizar catálogo dos PDFs publicados"
            fi
            if git push origin HEAD:main; then
              echo "PDFs FAMEMA e catálogo publicados na main."
              exit 0
            fi
            echo "Branch atualizada simultaneamente; repetindo integração ($attempt/5)."
            sleep $((attempt * 3))
          done
          echo "Não foi possível concluir a publicação após cinco tentativas."
          exit 1
